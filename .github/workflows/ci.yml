name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m simulator.bootstrap --materialize
      - run: ruff check .
      - run: mypy api agents evals mcp ml persistence retrieval runtime safety simulator
      - run: >-
          pytest --cov=api --cov=agents --cov=runtime --cov=mcp --cov=ml
          --cov=persistence --cov=retrieval --cov=safety --cov=simulator
          --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pip-audit
      - run: pip-audit
      - run: docker compose config --quiet
      - run: docker build -f infrastructure/docker/api.Dockerfile -t sentinel-api:ci .
