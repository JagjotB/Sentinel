name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m simulator.bootstrap --materialize
      - run: ruff check .
      - run: mypy api agents evals mcp ml persistence retrieval runtime safety simulator
      - run: >-
          pytest --cov=api --cov=agents --cov=runtime --cov=mcp --cov=ml
          --cov=persistence --cov=retrieval --cov=safety --cov=simulator
          --cov-report=term-missing --cov-report=xml
      - run: python -m evals.runner --suite portfolio --scenario-limit 1 --output .artifacts/eval-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pip-audit
      - run: pip-audit
      - run: docker compose config --quiet
      - run: docker build -f infrastructure/docker/api.Dockerfile -t sentinel-api:ci .
      - run: docker build -f infrastructure/docker/demo-service.Dockerfile -t sentinel-demo:ci .
      - run: docker build -f infrastructure/docker/traffic.Dockerfile -t sentinel-traffic:ci .
      - name: Install kind
        run: |
          curl --fail --location --output /tmp/kind https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64
          curl --fail --location --output /tmp/kind.sha256sum https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64.sha256sum
          cd /tmp
          sha256sum --check kind.sha256sum
          sudo install --mode 0755 kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - name: Bootstrap and exercise real kind simulator
        run: |
          python -m simulator.cluster bootstrap
          python -m simulator.cluster status
          python - <<'PY'
          from simulator.faults.kubernetes import KubernetesFaultController

          controller = KubernetesFaultController()
          receipt = controller.inject("oom_killed_001")
          assert receipt.root_cause == "oom_killed"
          assert receipt.observation.get("available") is True
          assert int(receipt.observation.get("resource_count", 0)) >= 6
          operations = controller.reset()
          assert operations
          PY
      - name: Delete kind simulator
        if: always()
        run: kind delete cluster --name sentinel
