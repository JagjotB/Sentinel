[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-reliability"
version = "0.1.0"
description = "Evidence-backed deep-agent reliability engineering platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "prometheus-client>=0.22,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
sentinel-api = "api.main:run"
sentinel-sim = "simulator.bootstrap:main"
sentinel-eval = "evals.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "agents*", "evals*", "mcp*", "ml*", "persistence*", "retrieval*", "runtime*", "safety*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
asyncio_mode = "auto"
markers = [
  "integration: exercises persistence and component boundaries",
  "e2e: exercises a complete incident workflow",
  "security: validates adversarial and permission behavior",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["evals/reports", "ml/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = ["tests", "frontend"]

