apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-demo-config
  namespace: sentinel-demo
data:
  PAYMENTS_URL: http://payments:8080
  FEATURE_FLAG: enabled
  TARGET_URL: http://checkout:8080/work
---
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-demo-secrets
  namespace: sentinel-demo
type: Opaque
stringData:
  PAYMENT_TOKEN: local-demo-token
  POSTGRES_PASSWORD: sentinel
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sentinel-demo
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sentinel-demo
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: sentinel
            - name: POSTGRES_DB
              value: sentinel
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinel-demo-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sentinel"]
            periodSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: sentinel-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sentinel-readonly
      securityContext:
        runAsNonRoot: true
      containers:
        - name: checkout
          image: sentinel/demo-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: checkout
            - name: SENTINEL_FAULT_MODE
              value: none
            - name: SENTINEL_SCENARIO_ID
              value: baseline
            - name: PAYMENTS_URL
              valueFrom:
                configMapKeyRef:
                  name: sentinel-demo-config
                  key: PAYMENTS_URL
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: sentinel-demo
spec:
  selector:
    app: checkout
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: sentinel-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sentinel-readonly
      securityContext:
        runAsNonRoot: true
      containers:
        - name: payments
          image: sentinel/demo-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: payments
            - name: SENTINEL_FAULT_MODE
              value: none
            - name: SENTINEL_SCENARIO_ID
              value: baseline
            - name: PAYMENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sentinel-demo-secrets
                  key: PAYMENT_TOKEN
            - name: DATABASE_URL
              value: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: sentinel-demo
spec:
  selector:
    app: payments
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
