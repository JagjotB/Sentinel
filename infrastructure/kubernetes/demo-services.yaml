metadata:
  name: worker
  namespace: sentinel-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sentinel-readonly
      securityContext:
        runAsNonRoot: true
      containers:
        - name: worker
          image: sentinel/demo-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: worker
            - name: SENTINEL_FAULT_MODE
              value: none
            - name: SENTINEL_SCENARIO_ID
