---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: sentinel-demo
spec:
  selector:
    app: worker
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sentinel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sentinel-readonly
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: sentinel/demo-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: frontend
            - name: SENTINEL_FAULT_MODE
              value: none
            - name: SENTINEL_SCENARIO_ID
              value: baseline
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sentinel-demo
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: sentinel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: traffic-generator
          image: sentinel/traffic-generator:local
          imagePullPolicy: Never
          env:
            - name: TARGET_URL
              valueFrom:
                configMapKeyRef:
                  name: sentinel-demo-config
                  key: TARGET_URL
            - name: REQUESTS_PER_SECOND
              value: "2"
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
