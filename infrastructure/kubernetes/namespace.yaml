apiVersion: v1
kind: Namespace
metadata:
  name: sentinel-demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-readonly
  namespace: sentinel-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinel-readonly
  namespace: sentinel-demo
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "events", "services", "configmaps", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinel-readonly
  namespace: sentinel-demo
subjects:
  - kind: ServiceAccount
    name: sentinel-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinel-readonly

