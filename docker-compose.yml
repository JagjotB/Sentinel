services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
    volumes: ["sentinel-postgres:/var/lib/postgresql/data"]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      SENTINEL_TEMPO_URL: http://tempo:3200
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    ports: ["8000:8000"]

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    command: ["sentinel-worker"]
    environment:
      SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel
      SENTINEL_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      SENTINEL_TEMPO_URL: http://tempo:3200
    depends_on:
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }

  tempo:
    image: grafana/tempo:2.10.7
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./infrastructure/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - sentinel-tempo:/var/tempo
    ports: ["3200:3200"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infrastructure/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on: [tempo]
    ports:
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [api]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: sentinel
      GF_SECURITY_ADMIN_PASSWORD: sentinel
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/sentinel-dashboard.json:/var/lib/grafana/dashboards/sentinel-dashboard.json:ro
    depends_on: [prometheus, tempo]
    ports: ["3001:3000"]

volumes:
  sentinel-postgres:
  sentinel-tempo:
